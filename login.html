<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Login - POS System</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <h3 class="text-center mb-4 fw-bold">Login</h3>
        
        <!-- Email Input -->
        <div class="mb-3">
            <label for="email" class="form-label text-muted">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
        </div>

        <!-- Password Input -->
        <div class="mb-3">
            <label for="password" class="form-label text-muted">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••">
        </div>

        <!-- Actions -->
        <div class="d-grid gap-2 mt-4">
            <button class="btn btn-primary" onclick="login()">Login</button>
            <button class="btn btn-outline-dark" onclick="createAnAccount()">Create an account</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="scripts/firebaseConfig.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
