<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Register - POS System</title>
</head>
<body>

    <div class="main-outer">
        <div class="inner-wrapper">

            <h3 class="mb-4">Register</h3>

            <!-- Email Field -->
            <div class="form-group mb-3">
                <input type="email" placeholder="Email here" class="form-control" id="email">
            </div>

            <!-- Password Field -->
            <div class="form-group mb-3">
                <input type="password" placeholder="Password here" class="form-control" id="password">
            </div>

            <!-- Buttons -->
            <div class="form-group mb-2">
                <button class="btn btn-primary w-100" onclick="register()">Register</button>
            </div>

            <div class="form-group">
                <button class="btn btn-dark w-100" onclick="alreadyHaveAccount()">Already have an account</button>
            </div>

        </div>
    </div>

  <!-- Firebase Script Tags -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- jQuery Script Tag (JS file එකට ඉහළින් තිබිය යුතුය) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- Config & Custom Scripts -->
    <script src="scripts/firebaseConfig.js"></script>
    <script src="scripts/register.js"></script> <!-- Folder Path එක හරියටම 'scripts/register.js' ද බලන්න -->
</body>
</html>
