<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>POS System - Dashboard</title>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">POS System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active fw-bold" href="dashboard.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="customer.html">Customer</a></li>
                    <li class="nav-item"><a class="nav-link" href="items.html">Item</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="place-order.html">Place Order</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="mb-4">
            <h2>Welcome to POS Dashboard</h2>
            <p class="text-muted">Manage your store inventory, customers, and daily sales.</p>
        </div>

        <!-- Summary Cards Section -->
        <div class="row g-4 mb-5">
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card bg-primary text-white p-3 shadow-sm rounded-3">
                    <div class="card-body">
                        <h5 class="card-title">Total Customers</h5>
                        <h2 class="display-5 fw-bold" id="customer-count">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card bg-success text-white p-3 shadow-sm rounded-3">
                    <div class="card-body">
                        <h5 class="card-title">Total Items</h5>
                        <h2 class="display-5 fw-bold" id="item-count">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card bg-warning text-dark p-3 shadow-sm rounded-3">
                    <div class="card-body">
                        <h5 class="card-title">Total Orders</h5>
                        <h2 class="display-5 fw-bold" id="order-count">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions Section -->
        <div class="card p-4 shadow-sm border-0 bg-light">
            <h5 class="mb-3 text-secondary">Quick Actions</h5>
            <div class="d-flex flex-wrap gap-3">
                <a href="place-order.html" class="btn btn-primary btn-lg">+ Place New Order</a>
                <a href="customer.html" class="btn btn-outline-secondary btn-lg">Manage Customers</a>
                <a href="items.html" class="btn btn-outline-secondary btn-lg">Manage Items</a>
                <a href="orders.html" class="btn btn-outline-secondary btn-lg">View History</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="scripts/firebaseConfig.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard Script -->
    <script>
        $(document).ready(function () {
            const firestore = firebase.firestore();

            // Load Customer Count
            firestore.collection('customers').get().then((snap) => {
                $('#customer-count').text(snap.size);
            });

            // Load Item Count
            firestore.collection('items').get().then((snap) => {
                $('#item-count').text(snap.size);
            });

            // Load Orders Count
            firestore.collection('orders').get().then((snap) => {
                $('#order-count').text(snap.size);
            });
        });
    </script>
</body>
</html>
