<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/items.css">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Toastr CSS -->
    <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet">
    <title>Item Management</title>
</head>
<body onload="loadItems()">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">POS System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/dashboard.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="customer.html">Customer</a></li>
                    <li class="nav-item"><a class="nav-link active" href="items.html">Item</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="place-order.html">Place Order</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-md-4">
                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" id="description" class="form-control">
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4">
                <div class="form-group">
                    <label for="qty-on-hand" class="form-label">Qty On Hand</label>
                    <input type="number" id="qty-on-hand" class="form-control">
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-4">
                <div class="form-group">
                    <label for="unit-price" class="form-label">Unit Price</label>
                    <input type="number" id="unit-price" class="form-control">
                </div>
            </div>
            <div class="col-12 mt-3">
                <input type="button" id="btn-create" class="btn btn-primary" value="Create Item" onclick="createItem()">
                <input type="button" id="btn-update" class="btn btn-success ms-2" value="Update Item" onclick="updateItem()">
            </div>
        </div>
    </div>

    <div class="container my-4">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#ID</th>
                    <th>Description</th>
                    <th>Qty On Hand</th>
                    <th>Unit Price</th>
                    <th>Options</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- rows loaded dynamically -->
            </tbody>
        </table>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Toastr JS 추가 කළා -->
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/toastr.min.js"></script>
    <script src="scripts/firebaseConfig.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/items.js"></script>
</body>
</html>
